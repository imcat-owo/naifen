name: Build Naifen iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install native build tools
        run: |
          brew install meson ninja llvm lld libarchive pkg-config
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Set up Go for Rclone build
        uses: actions/setup-go@v5
        with:
          go-version-file: deps/rclone-mobile/go.mod
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Prepare provider customization
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Patch iSH VDSO linker path for macOS
        run: |
          lld_prefix="$(brew --prefix lld)"
          test -x "$lld_prefix/bin/ld.lld"
          sed -i '' "s#'-fuse-ld=lld'#'-fuse-ld=$lld_prefix/bin/ld.lld'#" \
            deps/ish/vdso/arm64/meson.build
          grep -F -- "-fuse-ld=$lld_prefix/bin/ld.lld" \
            deps/ish/vdso/arm64/meson.build

      - name: Build iOS native dependencies
        run: |
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_rclone_ios.sh
          ./deps/build_ish.sh release
          ./deps/prepare_alpine_rootfs.sh

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis

      - name: Archive 奶粉 app unsigned
        run: |
          mkdir -p build
          xcodebuild archive \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Naifen.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app="build/Naifen.xcarchive/Products/Applications/Minis.app"
          test -d "$app"
          mkdir -p build/Payload
          cp -R "$app" build/Payload/Minis.app
          cd build/Payload
          /usr/bin/zip -qry "../Naifen-unsigned-${{ github.run_number }}.ipa" Minis.app
          cd ../..
          /usr/bin/file "build/Naifen-unsigned-${{ github.run_number }}.ipa"
          /usr/bin/du -h "build/Naifen-unsigned-${{ github.run_number }}.ipa"

      - name: Upload 奶粉 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Naifen-iOS-unsigned-${{ github.run_number }}
          path: build/Naifen-unsigned-${{ github.run_number }}.ipa
          if-no-files-found: error
          retention-days: 14
