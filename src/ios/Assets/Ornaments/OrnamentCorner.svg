<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- OrnamentCorner — original line art. Single corner flourish for the
       top-left corner of a hero/profile surface. Pair with nothing else on
       the same surface (one ornamental frame per surface max). -->
  <g fill="none" stroke="#ECC7D6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <defs>
      <g id="rose">
        <path d="M-6,1 A6,6 0 1,1 6,-1 A4.5,4.5 0 1,1 -3,2 A3,3 0 1,0 3,-1"/>
        <path d="M-9,-6 C-13,-11 -6,-15 -1,-12"/>
        <path d="M9,-6 C13,-11 6,-15 1,-12"/>
        <path d="M-10,5 C-13,10 -6,14 -1,11"/>
        <path d="M10,5 C13,10 6,14 1,11"/>
      </g>
      <g id="leaf">
        <path d="M0,0 C6,-5 13,-4 17,1 C11,5 4,4 0,0 Z"/>
        <path d="M1,0 C6,-1 11,0 16,1"/>
      </g>
      <g id="bfly">
        <path d="M0,-2 C-12,-18 -30,-16 -26,-2 C-23,8 -8,7 0,-2 Z"/>
        <path d="M0,-2 C12,-18 30,-16 26,-2 C23,8 8,7 0,-2 Z"/>
        <path d="M-1,2 C-11,8 -19,16 -13,21 C-7,23 -2,12 -1,2 Z"/>
        <path d="M1,2 C11,8 19,16 13,21 C7,23 2,12 1,2 Z"/>
        <path d="M0,-6 L0,18"/>
        <path d="M0,-6 C-3,-12 -6,-14 -9,-15"/>
        <path d="M0,-6 C3,-12 6,-14 9,-15"/>
      </g>
    </defs>
    <path d="M8,172 V44 Q8,8 44,8 H172"/>
    <path d="M20,172 V56 Q20,20 56,20 H172" stroke-width="0.75"/>
    <path d="M8,44 C24,44 30,50 30,56 C30,62 24,64 20,60 C17,56 21,51 25,53"/>
    <use href="#rose" transform="translate(66,66) scale(1.1)"/>
    <use href="#leaf" transform="translate(78,74) rotate(30)"/>
    <use href="#leaf" transform="translate(54,78) rotate(140)"/>
    <circle cx="8" cy="104" r="2"/>
    <circle cx="8" cy="140" r="2"/>
    <circle cx="104" cy="8" r="2"/>
    <circle cx="140" cy="8" r="2"/>
    <use href="#bfly" transform="translate(116,116) scale(0.5)"/>
  </g>
</svg>
