<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- OrnamentFrame — original line art. Double hairline frame with corner
       roses and edge beads. One ornamental frame per surface max, always
       behind content, never under body text. -->
  <g fill="none" stroke="#ECC7D6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <defs>
      <g id="rose">
        <path d="M-6,1 A6,6 0 1,1 6,-1 A4.5,4.5 0 1,1 -3,2 A3,3 0 1,0 3,-1"/>
        <path d="M-9,-6 C-13,-11 -6,-15 -1,-12"/>
        <path d="M9,-6 C13,-11 6,-15 1,-12"/>
        <path d="M-10,5 C-13,10 -6,14 -1,11"/>
        <path d="M10,5 C13,10 6,14 1,11"/>
      </g>
      <g id="scroll">
        <path d="M0,0 C16,0 22,7 22,13 C22,19 16,21 12,17 C9,13 13,8 17,10"/>
      </g>
    </defs>
    <rect x="12" y="12" width="336" height="336"/>
    <rect x="22" y="22" width="316" height="316" stroke-width="0.75"/>
    <use href="#scroll" transform="translate(12,12)"/>
    <use href="#scroll" transform="translate(348,12) scale(-1,1)"/>
    <use href="#scroll" transform="translate(12,348) scale(1,-1)"/>
    <use href="#scroll" transform="translate(348,348) scale(-1,-1)"/>
    <use href="#rose" transform="translate(46,46)"/>
    <use href="#rose" transform="translate(314,314)"/>
    <circle cx="180" cy="12" r="2"/>
    <circle cx="180" cy="348" r="2"/>
    <circle cx="12" cy="180" r="2"/>
    <circle cx="348" cy="180" r="2"/>
  </g>
</svg>
