<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <!-- WallpaperMilkPink — original line art. Pale milk-pink ground, faint
       ornamental line art at the edges only. Legibility: the app places the
       scheme background gradient (85% top -> 60% bottom) between this
       wallpaper and content; ornament never sits under body text. -->
  <rect width="390" height="844" fill="#FFF4F5"/>
  <g fill="none" stroke="#ECC7D6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <defs>
      <g id="rose">
        <path d="M-6,1 A6,6 0 1,1 6,-1 A4.5,4.5 0 1,1 -3,2 A3,3 0 1,0 3,-1"/>
        <path d="M-9,-6 C-13,-11 -6,-15 -1,-12"/>
        <path d="M9,-6 C13,-11 6,-15 1,-12"/>
        <path d="M-10,5 C-13,10 -6,14 -1,11"/>
        <path d="M10,5 C13,10 6,14 1,11"/>
      </g>
      <g id="leaf">
        <path d="M0,0 C6,-5 13,-4 17,1 C11,5 4,4 0,0 Z"/>
        <path d="M1,0 C6,-1 11,0 16,1"/>
      </g>
      <g id="bfly">
        <path d="M0,-2 C-12,-18 -30,-16 -26,-2 C-23,8 -8,7 0,-2 Z"/>
        <path d="M0,-2 C12,-18 30,-16 26,-2 C23,8 8,7 0,-2 Z"/>
        <path d="M-1,2 C-11,8 -19,16 -13,21 C-7,23 -2,12 -1,2 Z"/>
        <path d="M1,2 C11,8 19,16 13,21 C7,23 2,12 1,2 Z"/>
        <path d="M0,-6 L0,18"/>
        <path d="M0,-6 C-3,-12 -6,-14 -9,-15"/>
        <path d="M0,-6 C3,-12 6,-14 9,-15"/>
      </g>
    </defs>
    <!-- faint arch, top centre -->
    <path d="M125,196 V112 A70,70 0 0,1 265,112 V196"/>
    <path d="M137,196 V114 A58,58 0 0,1 253,114 V196" stroke-width="0.75"/>
    <path d="M195,42 V58"/>
    <circle cx="195" cy="62" r="2"/>
    <use href="#rose" transform="translate(125,202) scale(0.8)"/>
    <use href="#rose" transform="translate(265,202) scale(0.8)"/>
    <!-- top-left rose cluster -->
    <use href="#rose" transform="translate(52,54) scale(1.2)"/>
    <use href="#leaf" transform="translate(64,62) rotate(24)"/>
    <use href="#leaf" transform="translate(40,66) rotate(150)"/>
    <use href="#bfly" transform="translate(100,92) scale(0.55)"/>
    <!-- bottom-right rose cluster -->
    <use href="#rose" transform="translate(338,790) scale(1.2)"/>
    <use href="#leaf" transform="translate(326,782) rotate(204)"/>
    <use href="#leaf" transform="translate(350,778) rotate(-30)"/>
    <use href="#bfly" transform="translate(296,752) scale(0.55)"/>
    <!-- lone butterflies, mid edges -->
    <use href="#bfly" transform="translate(70,420) scale(0.5)"/>
    <use href="#bfly" transform="translate(322,300) scale(0.5)"/>
    <!-- bead chains, left + right edges -->
    <g>
      <circle cx="16" cy="260" r="2"/><circle cx="16" cy="280" r="2"/><circle cx="16" cy="300" r="2"/>
      <circle cx="16" cy="320" r="2"/><circle cx="16" cy="340" r="2"/><circle cx="16" cy="360" r="2"/>
      <circle cx="16" cy="540" r="2"/><circle cx="16" cy="560" r="2"/><circle cx="16" cy="580" r="2"/>
      <circle cx="374" cy="260" r="2"/><circle cx="374" cy="280" r="2"/><circle cx="374" cy="300" r="2"/>
      <circle cx="374" cy="320" r="2"/><circle cx="374" cy="340" r="2"/><circle cx="374" cy="360" r="2"/>
      <circle cx="374" cy="540" r="2"/><circle cx="374" cy="560" r="2"/><circle cx="374" cy="580" r="2"/>
    </g>
    <!-- scalloped lace, bottom edge -->
    <path d="M40,822 q10,8 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0" stroke-width="0.75"/>
  </g>
</svg>
