<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- AvatarFrame — original line art. Double hairline circle with a small
       rose at top and bottom and bead dots around the ring. Frames the
       circular avatar; never hollow, never squircle. -->
  <g fill="none" stroke="#ECC7D6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.35">
    <defs>
      <g id="rose">
        <path d="M-6,1 A6,6 0 1,1 6,-1 A4.5,4.5 0 1,1 -3,2 A3,3 0 1,0 3,-1"/>
        <path d="M-9,-6 C-13,-11 -6,-15 -1,-12"/>
        <path d="M9,-6 C13,-11 6,-15 1,-12"/>
        <path d="M-10,5 C-13,10 -6,14 -1,11"/>
        <path d="M10,5 C13,10 6,14 1,11"/>
      </g>
    </defs>
    <circle cx="100" cy="100" r="94"/>
    <circle cx="100" cy="100" r="86" stroke-width="0.75"/>
    <use href="#rose" transform="translate(100,12) scale(0.8)"/>
    <use href="#rose" transform="translate(100,188) scale(0.8)"/>
    <circle cx="164" cy="36" r="2"/>
    <circle cx="36" cy="36" r="2"/>
    <circle cx="164" cy="164" r="2"/>
    <circle cx="36" cy="164" r="2"/>
    <circle cx="190" cy="100" r="2"/>
    <circle cx="10" cy="100" r="2"/>
  </g>
</svg>
